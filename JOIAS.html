<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurum | Joalheria Contemporânea</title>
    <!-- Fontes e Ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        :root {
            --bg-loja: #faf9f6;
            --bg-painel: #f1f3f6;
            --primary: #111111;
            --accent: #c5a880; /* Dourado Champagne */
            --accent-hover: #b0926a;
            --text-dark: #222222;
            --text-light: #666666;
            --card-bg: #ffffff;
            --border: #e5e5e5;
            --success: #2ec4b6;
            --danger: #e63946;
            --shadow: 0 10px 30px rgba(0,0,0,0.03);
            --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-loja);
            color: var(--text-dark);
            overflow-x: hidden;
            transition: background-color 0.5s ease;
        }

        /* Utilidades de Visualização (Alternância de Páginas) */
        .page {
            display: none;
            min-height: 100vh;
            animation: fadeIn 0.4s ease forwards;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            width: 90%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ==========================================================================
           CABECALHO GLOBAL
           ========================================================================== */
        header {
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            transition: var(--transition);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 0;
        }

        .brand {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 4px;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .btn-nav {
            background: none;
            border: none;
            font-size: 1rem;
            color: var(--text-dark);
            cursor: pointer;
            position: relative;
            padding: 0.5rem;
            transition: var(--transition);
        }

        .btn-nav:hover {
            color: var(--accent);
        }

        .btn-login {
            background-color: var(--primary);
            color: var(--bg-loja);
            padding: 0.6rem 1.5rem;
            border-radius: 4px;
            font-weight: 500;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-login:hover {
            background-color: var(--accent);
            color: var(--primary);
        }

        /* ==========================================================================
           PÁGINA DO CLIENTE (LOJA)
           ========================================================================== */
        #page-cliente {
            padding-top: 6rem;
        }

        .hero {
            height: 450px;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?q=80&w=1887&auto=format&fit=crop') center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            border-radius: 8px;
            margin-bottom: 4rem;
        }

        .hero-content h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            letter-spacing: 6px;
            margin-bottom: 1rem;
        }

        .hero-content p {
            font-weight: 300;
            letter-spacing: 2px;
            font-size: 1.1rem;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 3rem;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 40px;
            height: 2px;
            background-color: var(--accent);
            margin: 0.8rem auto 0;
        }

        /* Grade de Joias */
        .jewelry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2.5rem;
            margin-bottom: 6rem;
        }

        .jewelry-card {
            background-color: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 1px solid transparent;
            position: relative;
        }

        .jewelry-card:hover {
            transform: translateY(-5px);
            border-color: var(--border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
        }

        .card-img-wrapper {
            width: 100%;
            height: 320px;
            background-color: #f7f7f7;
            overflow: hidden;
            position: relative;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .jewelry-card:hover .card-img-wrapper img {
            transform: scale(1.04);
        }

        .card-info {
            padding: 1.5rem;
            text-align: center;
        }

        .card-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--primary);
            margin-bottom: 0.8rem;
        }

        .card-price {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--accent);
        }

        .out-of-stock-badge {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background-color: rgba(230, 57, 70, 0.9);
            color: white;
            padding: 0.4rem 0.8rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
            border-radius: 4px;
        }

        /* ==========================================================================
           PÁGINA DO VENDEDOR (PAINEL ADMIN)
           ========================================================================== */
        #page-vendedor {
            padding-top: 5.5rem;
            background-color: var(--bg-painel);
        }

        .admin-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 2rem;
            padding-bottom: 4rem;
        }

        /* Painel Lateral de Cadastro */
        .admin-sidebar {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: var(--shadow);
            height: fit-content;
            position: sticky;
            top: 7rem;
        }

        .sidebar-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-light);
            margin-bottom: 0.4rem;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.9rem;
            background-color: #fafafa;
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            background-color: #fff;
        }

        .btn-submit {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: var(--accent);
            color: var(--primary);
        }

        /* Área de Controle Principal */
        .admin-main {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 1.5rem 2rem;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .admin-header h2 {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .btn-back-store {
            background-color: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 0.5rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .btn-back-store:hover {
            background-color: var(--primary);
            color: white;
        }

        /* Tabela Gerencial Exclusiva */
        .table-responsive {
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #fcfcfc;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        .td-product {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .td-img {
            width: 50px;
            height: 50px;
            border-radius: 4px;
            object-fit: cover;
            background-color: #f7f7f7;
        }

        .input-inline-table {
            width: 90px;
            padding: 0.4rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-weight: 500;
        }

        .input-inline-table:focus {
            border-color: var(--accent);
            outline: none;
        }

        .actions-cell {
            display: flex;
            gap: 0.8rem;
        }

        .btn-action {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.05rem;
            transition: var(--transition);
        }

        .btn-save { color: var(--success); }
        .btn-save:hover { transform: scale(1.15); }
        .btn-delete { color: var(--danger); }
        .btn-delete:hover { transform: scale(1.15); }

        /* Responsividade */
        @media(max-width: 992px) {
            .admin-layout { grid-template-columns: 1fr; }
            .admin-sidebar { position: static; }
            .hero-content h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO GLOBAL -->
    <header>
        <div class="container nav-container">
            <a href="#" class="brand" onclick="switchPage('cliente')">AURUM</a>
            <div class="nav-actions">
                <button class="btn-nav" aria-label="Buscar"><i class="fa-solid fa-magnifying-glass"></i></button>
                <button class="btn-nav" aria-label="Favoritos"><i class="fa-regular fa-heart"></i></button>
                <button class="btn-nav btn-login" id="nav-btn-entrar" onclick="switchPage('vendedor')">Entrar</button>
            </div>
        </div>
    </header>

    <!-- PÁGINA DO CLIENTE (LOJA) -->
    <div id="page-cliente" class="page active">
        <div class="container">
            <div class="hero">
                <div class="hero-content">
                    <h1>Elegância Minimalista</h1>
                    <p>Joias autorais moldadas em Ouro 18k e Diamantes selecionados.</p>
                </div>
            </div>
            
            <h2 class="section-title">Coleção Atemporal</h2>
            <div class="jewelry-grid" id="loja-grid-produtos">
                <!-- Injetado via JavaScript Dinâmico -->
            </div>
        </div>
    </div>

    <!-- PÁGINA DO VENDEDOR (PAINEL DE ESTOQUE E PREÇOS) -->
    <div id="page-vendedor" class="page">
        <div class="container">
            <div class="admin-layout">
                
                <!-- Formulário de Cadastro Lateral -->
                <aside class="admin-sidebar">
                    <h3 class="sidebar-title"><i class="fa-solid fa-gem"></i> Nova Joia</h3>
                    <form id="form-cadastro-produto" onsubmit="cadastrarProduto(event)">
                        <div class="form-group">
                            <label for="prod-nome">Nome da Peça</label>
                            <input type="text" id="prod-nome" class="form-control" required placeholder="Ex: Anel Solitário Vintage">
                        </div>
                        <div class="form-group">
                            <label for="prod-categoria">Categoria</label>
                            <select id="prod-categoria" class="form-control">
                                <option value="Anéis">Anéis</option>
                                <option value="Colares">Colares</option>
                                <option value="Brincos">Brincos</option>
                                <option value="Pulseiras">Pulseiras</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="prod-preco">Preço (R$)</label>
                            <input type="number" step="0.01" id="prod-preco" class="form-control" required placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label for="prod-estoque">Estoque Inicial</label>
                            <input type="number" id="prod-estoque" class="form-control" required placeholder="Quantidade">
                        </div>
                        <div class="form-group">
                            <label for="prod-foto">URL da Foto</label>
                            <input type="url" id="prod-foto" class="form-control" placeholder="Link da imagem (opcional)">
                        </div>
                        <button type="submit" class="btn-submit">Publicar na Loja</button>
                    </form>
                </aside>

                <!-- Painel Geral e Listagem Gerenciável -->
                <main class="admin-main">
                    <div class="admin-header">
                        <div>
                            <h2>Gestão Operacional</h2>
                            <p style="font-size: 0.85rem; color: var(--text-light)">Controle preços, imagens e estoques em tempo real.</p>
                        </div>
                        <button class="btn-back-store" onclick="switchPage('cliente')"><i class="fa-solid fa-arrow-left"></i> Ver Loja</button>
                    </div>

                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Produto</th>
                                    <th>Categoria</th>
                                    <th>Preço (R$)</th>
                                    <th>Estoque</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-admin-produtos">
                                <!-- Injetado via JavaScript Dinâmico -->
                            </tbody>
                        </table>
                    </div>
                </main>

            </div>
        </div>
    </div>

    <!-- Inclui a biblioteca oficial do Supabase via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // 1. CONFIGURAÇÃO DO BANCO (Substitua a KEY pela chave longa 'anon' do seu painel)
        const SUPABASE_URL = "https://wpdpbzvlggdpwvmgtxxn.supabase.co";
        const SUPABASE_KEY = "INSIRA_AQUI_AQUELA_CHAVE_LONGA_ANON_DO_PAINEL"; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let bancoProdutos = [];

        // Inicializador do Sistema ao carregar a página
        document.addEventListener("DOMContentLoaded", () => {
            carregarDadosDoBanco();
        });

        // Ação: Buscar informações no Banco de Dados
        async function carregarDadosDoBanco() {
            const { data, error } = await _supabase
                .from('produtos')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error("Erro ao buscar dados:", error);
                return;
            }

            bancoProdutos = data;
            renderizarLoja();
            renderizarTabelaAdmin();
        }

        // Sistema de Troca de Páginas (Mecânica Single Page)
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(`page-${pageId}`).classList.add('active');
            
            const navBtn = document.getElementById('nav-btn-entrar');
            if (pageId === 'vendedor') {
                document.body.style.backgroundColor = 'var(--bg-painel)';
                navBtn.textContent = "Sair do Painel";
                navBtn.onclick = () => switchPage('cliente');
            } else {
                document.body.style.backgroundColor = 'var(--bg-loja)';
                navBtn.textContent = "Entrar";
                navBtn.onclick = () => switchPage('vendedor');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Renderizador da Visão do Cliente (Loja)
        function renderizarLoja() {
            const grid = document.getElementById('loja-grid-produtos');
            grid.innerHTML = '';

            bancoProdutos.forEach(prod => {
                const badgeFalta = prod.estoque <= 0 ? `<span class="out-of-stock-badge">Esgotado</span>` : '';
                const fotoPadrao = prod.foto || 'https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?q=80&w=600&auto=format&fit=crop';
                
                grid.innerHTML += `
                    <article class="jewelry-card">
                        ${badgeFalta}
                        <div class="card-img-wrapper">
                            <img src="${fotoPadrao}" alt="${prod.nome}" onerror="this.src='https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?q=80&w=600&auto=format&fit=crop'">
                        </div>
                        <div class="card-info">
                            <p class="card-category">${prod.categoria}</p>
                            <h3 class="card-title">${prod.nome}</h3>
                            <p class="card-price">R$ ${parseFloat(prod.preco).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</p>
                        </div>
                    </article>
                `;
            });
        }

        // Renderizador da Visão do Vendedor (Tabela Admin Interativa)
        function renderizarTabelaAdmin() {
            const tbody = document.getElementById('tabela-admin-produtos');
            tbody.innerHTML = '';

            bancoProdutos.forEach(prod => {
                const fotoPadrao = prod.foto || 'https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?q=80&w=600&auto=format&fit=crop';
                tbody.innerHTML += `
                    <tr>
                        <td>
                            <div class="td-product">
                                <img src="${fotoPadrao}" class="td-img" alt="">
                                <div>
                                    <strong style="display:block; color:var(--primary)">${prod.nome}</strong>
                                    <span style="font-size:0.75rem; color:var(--text-light)">ID: #${prod.id}</span>
                                </div>
                            </div>
                        </td>
                        <td><span style="background:#eee; padding:0.3rem 0.6rem; border-radius:4px; font-size:0.8rem">${prod.categoria}</span></td>
                        <td>
                            <input type="number" step="0.01" class="input-inline-table" id="input-price-${prod.id}" value="${prod.preco}">
                        </td>
                        <td>
                            <input type="number" class="input-inline-table" id="input-stock-${prod.id}" value="${prod.estoque}">
                        </td>
                        <td>
                            <div class="actions-cell">
                                <button class="btn-action btn-save" onclick="salvarAlteracaoInline(${prod.id})" title="Salvar Alterações">
                                    <i class="fa-solid fa-square-check"></i>
                                </button>
                                <button class="btn-action btn-delete" onclick="deletarProduto(${prod.id})" title="Remover Produto">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        // Ação: Cadastrar Nova Peça no Banco de Dados
        async function cadastrarProduto(e) {
            e.preventDefault();
            
            const novoProd = {
                nome: document.getElementById('prod-nome').value,
                categoria: document.getElementById('prod-categoria').value,
                preco: parseFloat(document.getElementById('prod-preco').value),
                estoque: parseInt(document.getElementById('prod-estoque').value),
                foto: document.getElementById('prod-foto').value || null
            };

            const { error } = await _supabase
                .from('produtos')
                .insert([novoProd]);

            if (error) {
                alert("Erro ao salvar produto no banco.");
                console.error(error);
            } else {
                document.getElementById('form-cadastro-produto').reset();
                carregarDadosDoBanco();
            }
        }

        // Ação: Atualizar Preço/Estoque Direto no Banco
        async function salvarAlteracaoInline(id) {
            const novoPreco = parseFloat(document.getElementById(`input-price-${id}`).value);
            const novoEstoque = parseInt(document.getElementById(`input-stock-${id}`).value);

            const { error } = await _supabase
                .from('produtos')
                .update({ preco: novoPreco, estoque: novoEstoque })
                .eq('id', id);

            if (error) {
                alert("Erro ao atualizar o banco de dados.");
                console.error(error);
            } else {
                alert('Produto atualizado com sucesso no servidor!');
                carregarDadosDoBanco();
            }
        }

        // Ação: Remover Produto do Banco
        async function deletarProduto(id) {
            if (confirm('Tem certeza de que deseja remover esta joia do banco de dados definitivamente?')) {
                const { error } = await _supabase
                    .from('produtos')
                    .delete()
                    .eq('id', id);

                if (error) {
                    alert("Erro ao deletar do banco.");
                    console.error(error);
                } else {
                    carregarDadosDoBanco();
                }
            }
        }
    </script>    
</body>
</html>
